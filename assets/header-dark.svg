<svg xmlns="http://www.w3.org/2000/svg" width="900" height="180" viewBox="0 0 900 180" role="img" aria-label="FrainTX">
  <title>FrainTX</title>
  <defs>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#5b63d9" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#7ea4ff" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#e4f3ff" stop-opacity="1"/>
      <stop offset="0.65" stop-color="#a9d6ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#5b63d9" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.6 0; 0.6 0; -0.6 0" dur="9s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a2f45" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#2a2f45" stop-opacity="1"/>
      <stop offset="1" stop-color="#2a2f45" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0.5" y="0.5" width="899" height="179" rx="14" fill="#0f1320" stroke="#232a3d"/>
  <g font-family="ui-monospace, 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace">
    <text x="48" y="78" font-size="40" font-weight="700" fill="#e7e9f4" letter-spacing="1">FrainTX</text>
    <text x="48" y="110" font-size="15" fill="#8a8fad">сети · обход блокировок · Go · Linux и Windows</text>
    <text x="852" y="78" font-size="13" fill="#8a8fad" text-anchor="end">github.com/FrainTX</text>
  </g>
  <rect x="48" y="138" width="804" height="1" fill="url(#rail)"/>
  <rect x="48" y="137" width="804" height="3" rx="1.5" fill="url(#beam)"/>
</svg>
