<svg xmlns="http://www.w3.org/2000/svg" width="900" height="180" viewBox="0 0 900 180" role="img" aria-label="FrainTX">
  <title>FrainTX</title>
  <defs>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#3d47b8" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#4d7ce0" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#9fc6f2" stop-opacity="1"/>
      <stop offset="0.65" stop-color="#6aa3e8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3d47b8" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.6 0; 0.6 0; -0.6 0" dur="9s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9deea" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#d9deea" stop-opacity="1"/>
      <stop offset="1" stop-color="#d9deea" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0.5" y="0.5" width="899" height="179" rx="14" fill="#f7f9fc" stroke="#d6dce6"/>
  <g font-family="ui-monospace, 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace">
    <text x="48" y="78" font-size="40" font-weight="700" fill="#151a2c" letter-spacing="1">FrainTX</text>
    <text x="48" y="110" font-size="15" fill="#5d6480">сети · обход блокировок · Go · Linux и Windows</text>
    <text x="852" y="78" font-size="13" fill="#5d6480" text-anchor="end">github.com/FrainTX</text>
  </g>
  <rect x="48" y="138" width="804" height="1" fill="url(#rail)"/>
  <rect x="48" y="137" width="804" height="3" rx="1.5" fill="url(#beam)"/>
</svg>
